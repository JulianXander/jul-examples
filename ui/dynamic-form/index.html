<!DOCTYPE html>
<html>

<head>
	<meta charset='utf-8'>
	<title>Dynamic Form</title>
	<script src='out/bundle.js' defer></script>
	<style>
		form {
			display: grid;
			gap: 8px;
			max-width: 300px;
		}
	</style>
</head>

<body>
	<form>
		<div>
			<label for="name">Name</label>
			<input id="name">
		</div>
		<div id="age-field">
			<label for="age">Alter</label>
			<input id="age" type="number" step="1">
		</div>
		<div>
			<input id="visible" type="checkbox" checked>
			<label for="visible">Alter angeben</label>
		</div>
		<output id="output"></output>
	</form>
</body>

</html>
